[package]
name = "lingua"
description = "Lingua – AI 翻译与语言学习助手"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
default-run = "lingua"

[lib]
name = "lingua_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lingua"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lingua-ai = { workspace = true }
oxideav-speex = "0.0"
lingua-core = { workspace = true }
lingua-database = { workspace = true }
lingua-dictionary = { workspace = true }
lingua-ocr = { workspace = true }
lingua-platform = { workspace = true }
lingua-secrets = { workspace = true }
lingua-translation = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# macOS popup 窗口按钮隐藏（Overlay 标题栏的交通灯）。
# 版本与 wry 依赖树对齐，避免重复编译。
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSButton", "NSWindow"] }

[lints]
workspace = true
