[package]
name = "lingua"
description = "Lingua – AI 翻译与语言学习助手"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
default-run = "lingua"

[lib]
name = "lingua_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lingua"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lingua-ai = { workspace = true }
lingua-core = { workspace = true }
lingua-database = { workspace = true }
lingua-dictionary = { workspace = true }
lingua-platform = { workspace = true }
lingua-secrets = { workspace = true }
lingua-translation = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2.3.2"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
