[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/lingua-core",
    "crates/lingua-platform",
    "crates/lingua-ai",
    "crates/lingua-database",
    "crates/lingua-secrets",
    "crates/lingua-translation",
    "crates/lingua-dictionary",
    "crates/lingua-ocr",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["taiyuuki"]

[workspace.dependencies]
# 内部 crate：所有跨 crate 依赖都走 workspace 统一管理
lingua-core = { path = "crates/lingua-core" }
lingua-platform = { path = "crates/lingua-platform" }
lingua-ai = { path = "crates/lingua-ai" }
lingua-database = { path = "crates/lingua-database" }
lingua-secrets = { path = "crates/lingua-secrets" }
lingua-translation = { path = "crates/lingua-translation" }
lingua-dictionary = { path = "crates/lingua-dictionary" }
lingua-ocr = { path = "crates/lingua-ocr" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", features = ["json"] }
rusqlite = { version = "0.40", features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
