name: Release

# 推送 v* tag 触发：tauri-action 构建各平台安装包并发布 GitHub Release，
# 同时生成 latest.json（应用内更新器的清单，endpoint 指向该文件）。
# 发版流程见 docs/RELEASE.md。

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # arm64 runner，出 universal 包
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # universal 需要两个架构的 std。
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # macOS：从 secrets 导入签名证书（与本机 tauri.conf.json 的
      # signingIdentity 同一枚 Apple Development 证书）。证书签名让 TCC
      # （辅助功能等）授权跨版本保留；ad-hoc 每次构建哈希都变，授权失效。
      - name: 导入 macOS 签名证书
        if: matrix.platform == 'macos-latest'
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$MACOS_SIGNING_P12" ]; then
            echo "::warning::未配置 MACOS_SIGNING_P12 secret，macOS 包将以 ad-hoc 签名（辅助功能授权随发版失效，见 docs/RELEASE.md）"
            exit 0
          fi
          certificate_path=$RUNNER_TEMP/signing-certificate.p12
          keychain_path=$RUNNER_TEMP/signing.keychain-db
          echo -n "$MACOS_SIGNING_P12" | base64 --decode --output "$certificate_path"
          security create-keychain -p "$MACOS_SIGNING_P12_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$MACOS_SIGNING_P12_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_SIGNING_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path" -T /usr/bin/codesign
          security set-keychain-partition-list -S apple-tool:,apple: -k "$MACOS_SIGNING_P12_PASSWORD" "$keychain_path"
          security list-keychain -d user -s "$keychain_path" login.keychain-db
          # 证书 SHA-1：与 tauri.conf.json > bundle > macOS > signingIdentity
          # 同一枚，续期换证时两处同步更新。
          echo "APPLE_SIGNING_IDENTITY=BB7B7C46B129E5FF2A1690EAFCF4DA633A7D10A1" >> "$GITHUB_ENV"

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          # tauri-action 创建 Release / 上传资产必需（Actions 自动注入的临时 token）。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新包的 minisign 签名私钥（与 tauri.conf.json 里的 pubkey 配对）。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 密钥为空密码，此 secret 无需创建（GitHub 也不允许空 secret）：
          # env 显式列出 → 变量必被定义为空字符串 → CLI 走空密码路径。
          # 切勿设占位符（如 "none"）——那会被当作真实密码导致解密失败。
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS 签名身份：证书导入成功时为证书哈希（上一步写入），否则
          # 回退 ad-hoc（"-"）。注意此 env 会覆盖 tauri.conf.json 的
          # signingIdentity；Windows 忽略该变量。更新包完整性另由 minisign 保证。
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY || '-' }}
        with:
          tagName: v__VERSION__
          releaseName: "Lingua v__VERSION__"
          releaseBody: "详见提交历史。"
          releaseDraft: false
          prerelease: false
          # 生成 latest.json 供应用内更新器使用；
          # Windows 优先 NSIS 安装器（MSI 为 v2 更新器的遗留路径）。
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
