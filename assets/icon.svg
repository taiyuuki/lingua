<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Lingua 应用图标源图：渐变圆角方块（应用主色 #4f6ef7 系）+
       白色对话气泡 +「文A」双字（跨语言翻译意象）。
       改动后运行 `pnpm icon` 重新生成 src-tauri/icons/ 全格式。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6285ff" />
      <stop offset="1" stop-color="#3b53d8" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#bg)" />

  <!-- 气泡尾巴（先画，被气泡主体盖住接缝） -->
  <path d="M336 660 L292 816 L474 660 Z" fill="#ffffff" />

  <!-- 气泡主体 -->
  <rect x="196" y="212" width="632" height="460" rx="132" fill="#ffffff" />

  <!-- 文（目标语言） + A（源语言），深浅两个蓝 -->
  <text
    x="392"
    y="556"
    font-family="Microsoft YaHei, SimHei, Noto Sans CJK SC, sans-serif"
    font-size="272"
    font-weight="700"
    fill="#2b3a8f"
    text-anchor="middle"
  >文</text>
  <text
    x="624"
    y="556"
    font-family="Segoe UI, Microsoft YaHei, sans-serif"
    font-size="176"
    font-weight="700"
    fill="#4f6ef7"
    text-anchor="middle"
  >A</text>
</svg>
